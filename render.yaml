# Render Blueprint — Web service with Neon Postgres
services:
  - type: web
    name: vvvaaa
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: CHAT_PASSWORD
        sync: false
