# Render Blueprint — https://render.com/docs/blueprint-spec
# Dashboard: New → Blueprint → connect this repo, or add a Static Site manually.
services:
  - type: web
    name: vvvaaa
    runtime: static
    buildCommand: ""
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
