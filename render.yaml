# MUST be Web Service (Node). Static Site → "Chat unavailable" (no /api).
version: "1"
projects:
  - name: Vudhu
    environments:
      - name: Production
        services:
          - type: web
            name: Meow?
            runtime: node
            repo: https://github.com/vidhu-ops/astro-platform-starter
            branch: main
            buildCommand: npm install
            startCommand: npm start
            healthCheckPath: /api/health
            autoDeployTrigger: commit
            domains:
              - sexychat.fun
              - www.sexychat.fun
            envVars:
              - key: NODE_VERSION
                value: "20"
              - key: DATABASE_URL
                sync: false
              - key: CHAT_PASSWORD
                sync: false
              - key: MESSAGE_ENCRYPTION_KEY
                sync: false
              - key: KLIPY_API_KEY
                sync: false
              - key: TENOR_API_KEY
                sync: false
              - key: VAPID_PUBLIC_KEY
                sync: false
              - key: VAPID_PRIVATE_KEY
                sync: false
              - key: VAPID_SUBJECT
                value: mailto:vidhugupta1996@gmail.com
