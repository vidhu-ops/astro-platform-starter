<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0408">
<title>SexyChats · vvvaaa</title>
<style>
:root{
  --bg:#0d0408;--panel:#1a0810;--panel2:#26101a;--rose:#ff2e75;--wine:#8a0f3c;--gold:#f5c97a;
  --text:#fbe9ef;--mute:#b98a9b;--line:#3a1626;--ok:#7dffb0;--warn:#ffb86b;--err:#ff8fb0;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif: Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(900px 500px at 80% -10%,#5a0f2e55,transparent),
    radial-gradient(700px 500px at -10% 110%,#8a0f3c44,transparent),var(--bg);
  color:var(--text);font-family:var(--serif);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.hide{display:none!important}
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{
  width:100%;max-width:400px;background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:24px;padding:32px 26px;
  box-shadow:0 0 60px #ff2e7522,0 24px 48px #0006;
}
h1{margin:0 0 4px;font-size:clamp(2rem,7vw,2.6rem);font-style:italic;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--rose),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:0 0 18px;font-size:14px;line-height:1.45}
.badge{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;
  padding:5px 10px;border-radius:999px;border:1px solid var(--line);margin-bottom:16px;color:var(--mute);
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.badge.live .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.badge.live{color:var(--ok);border-color:#7dffb044}
.badge.warn .dot{background:var(--warn);animation:pulse 1.2s infinite}
.badge.err .dot{background:var(--err)}
@keyframes pulse{50%{opacity:.35}}
input[type=text],input[type=password]{
  width:100%;background:#12050b;border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin-bottom:12px;outline:none;font-family:var(--sans);font-size:16px;
}
input:focus{border-color:var(--rose);box-shadow:0 0 0 3px #ff2e7533}
.btn{
  width:100%;border:0;border-radius:12px;padding:13px;cursor:pointer;font-weight:600;
  letter-spacing:.4px;font-family:var(--sans);
  background:linear-gradient(90deg,var(--wine),var(--rose));box-shadow:0 6px 24px #ff2e7544;
  transition:transform .12s,opacity .12s;
}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px;font-family:var(--sans)}
#app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto;position:relative}
header{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line);background:#12050bcc;backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:10;
}
header h2{margin:0;font-size:1.35rem;font-style:italic;
  background:linear-gradient(90deg,var(--rose),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr-meta{font-family:var(--sans);font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hdr-actions{display:flex;flex-wrap:wrap;gap:6px}
.hdr-actions button{
  background:#1a0810;border:1px solid var(--line);border-radius:20px;padding:6px 12px;
  cursor:pointer;color:var(--mute);font-family:var(--sans);font-size:12px;
}
.hdr-actions button:hover{border-color:var(--rose);color:var(--text)}
#online{color:var(--ok)}
#me{color:var(--gold)}
#feed{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msg{
  max-width:min(82%,520px);padding:10px 13px;border-radius:18px;background:var(--panel2);
  border:1px solid var(--line);word-wrap:break-word;overflow-wrap:anywhere;
}
.msg.me{background:linear-gradient(135deg,var(--wine),#c2185b);border-color:#ff2e7566}
.who{font-size:12px;color:var(--gold);margin-bottom:3px;font-style:italic}.me .who{color:#ffd9e6}
.t{font-size:10px;color:var(--mute);margin-top:4px;text-align:right;font-family:var(--sans)}
.msg img,.msg video{max-width:100%;max-height:340px;border-radius:12px;display:block;margin-top:6px}
.msg a{color:var(--gold)}
.file{display:inline-block;margin-top:6px;padding:8px 12px;border:1px dashed var(--rose);border-radius:10px;text-decoration:none}
#bar{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:#12050bee;position:relative}
#bar input[type=text]{margin:0;flex:1;border-radius:24px}
#bar.disabled{opacity:.55;pointer-events:none}
.ic{width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:19px}
.ic:disabled{opacity:.4;cursor:not-allowed}
.send{width:46px;height:42px;flex:none;border:0;border-radius:24px;background:linear-gradient(90deg,var(--wine),var(--rose));cursor:pointer;font-size:18px}
#emo{
  position:absolute;bottom:64px;left:12px;right:12px;max-width:360px;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(8,1fr);
  gap:4px;max-height:200px;overflow:auto;box-shadow:0 12px 40px #000a;
}
#emo button{background:none;border:0;font-size:22px;cursor:pointer;padding:4px;border-radius:8px}
#emo button:hover{background:#ff2e7522}
.row{display:flex;gap:8px;align-items:flex-end}.row.me{justify-content:flex-end}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:bold;color:#fff}
.day{align-self:center;font-size:11px;color:var(--mute);letter-spacing:1px;text-transform:uppercase;margin:8px 0 2px;font-family:var(--sans)}
.empty{margin:auto;color:var(--mute);font-style:italic;text-align:center;padding:30px;max-width:280px;line-height:1.5}
.show{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;margin:0 0 14px;font-family:var(--sans)}
.show input{accent-color:var(--rose);width:auto;margin:0}
#down{
  position:absolute;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:40px;height:40px;
  border-radius:50%;border:1px solid var(--rose);background:var(--panel);cursor:pointer;z-index:5;box-shadow:0 4px 16px #0008;
}
#lb{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:30;cursor:zoom-out;backdrop-filter:blur(4px)}
#lb img{max-width:94%;max-height:92%;border-radius:12px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;backdrop-filter:blur(6px)}
#modal .card{max-width:340px}#modal p{margin:0 0 16px}#modal .btn{margin-bottom:8px}
#modal .btn.alt{background:var(--panel2);border:1px solid var(--line);box-shadow:none}
#note{
  color:var(--mute);font-size:12px;text-align:center;padding:4px 12px;font-family:var(--sans);
  min-height:20px;transition:color .2s;
}
#note.ok{color:var(--ok)}#note.bad{color:var(--err)}
#load-feed{display:flex;justify-content:center;padding:24px;color:var(--mute);font-family:var(--sans);font-size:13px}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <div id="conn-badge" class="badge warn"><span class="dot"></span><span id="conn-label">Checking connection…</span></div>
    <h1>SexyChats</h1>
    <p class="sub">Private velvet lounge. One shared password — pick a username and join.</p>
    <input id="u" type="text" placeholder="Username" autocomplete="username" maxlength="20" enterkeyhint="next">
    <input id="p" type="password" placeholder="Room password" autocomplete="current-password" enterkeyhint="go">
    <label class="show"><input type="checkbox" id="sp">Show password</label>
    <button class="btn" id="go" disabled>Sign in</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <h2>SexyChats</h2>
    <div class="hdr-meta">
      <span id="online"></span>
      <span id="me"></span>
      <span id="conn-pill" class="badge live hide"><span class="dot"></span>Live</span>
    </div>
    <div class="hdr-actions">
      <button type="button" id="sv" class="hide" title="Keep this chat">Save</button>
      <button type="button" id="del" title="Clear entire chat">Clear</button>
      <button type="button" id="out">Leave</button>
    </div>
  </header>
  <div id="load-feed" class="hide">Syncing messages…</div>
  <div id="feed"></div>
  <div id="note"></div>
  <div id="bar">
    <div id="emo" class="hide"></div>
    <button type="button" class="ic" id="emob" title="Emoji">😘</button>
    <button type="button" class="ic" id="att" title="Attach">📎</button>
    <input type="file" id="file" class="hide" accept="image/*,video/*,.pdf,.txt,.csv,.md,.json">
    <input type="text" id="txt" placeholder="Whisper something… link or GIF URL works too" autocomplete="off" enterkeyhint="send">
    <button type="button" class="send" id="send" title="Send">➤</button>
  </div>
</div>
<div id="lb" class="hide"><img id="lbi" alt=""></div>
<div id="modal" class="hide">
  <div class="card">
    <h1 id="mt" style="font-size:28px"></h1>
    <p class="sub" id="mp"></p>
    <button type="button" class="btn" id="m1"></button>
    <button type="button" class="btn alt" id="m2"></button>
    <button type="button" class="btn alt" id="m3">Cancel</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const EMOJI = "😘 😍 🥵 😏 😈 🔥 💋 ❤️ 💕 💘 😉 🥰 😜 🍑 🍒 🍷 🌹 ✨ 💃 🕺 😳 🙈 😂 🤤 💦 🖤 👀 🫦 😻 💫 🥂 🎉".split(" ");
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },
};

let mode = null;
let apiToken = store.get("vvvaaa-token");
let nativeDb = null, db = null, assets = null, room = null, uid = null, name = null;
let unsub = null, unsubMeta = null, pollTimer = null, presenceTimer = null;
let lastMsgs = [], lastDocs = [], joinedAt = 0, chatReady = false;

function setNote(text, kind = "") {
  $("note").textContent = text || "";
  $("note").className = kind ? kind : "";
}
function setConnBadge(state, label) {
  const b = $("conn-badge");
  b.className = "badge " + state;
  $("conn-label").textContent = label;
  if (state === "live" && $("conn-pill")) {
    $("conn-pill").classList.remove("hide");
  }
}

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (apiToken) headers.Authorization = "Bearer " + apiToken;
  if (opts.body && !(opts.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { status: res.status, data });
  return data;
}

async function detectBackend() {
  try {
    const h = await fetch("/api/health").then(r => r.json());
    if (h.ok && h.db) {
      mode = "api";
      setConnBadge("live", "Database connected · Neon");
      $("go").disabled = false;
      return;
    }
    if (h.db === false) setConnBadge("err", "Server up — add DATABASE_URL on Render");
  } catch {
    /* static-only host */
  }
  try {
    if (typeof claude !== "undefined") {
      nativeDb = await claude.use("db");
      assets = await claude.use("assets");
      const u = await claude.use("user");
      uid = u ? await u.id() : null;
      if (nativeDb && uid) {
        mode = "claude";
        setConnBadge("live", "Claude platform connected");
        $("go").disabled = false;
        return;
      }
    }
  } catch {}
  setConnBadge("warn", "No backend — configure Neon or open on claude.ai");
  $("err").textContent = mode ? "" : "Chat backend unavailable.";
}

function claudeDbAdapter() {
  const root = nativeDb;
  return {
    collection(col) {
      const chain = {
        _col: col,
        doc(id) {
          const ref = root.collection(col).doc(id);
          return {
            async get() { return ref.get(); },
            async set(d) { return ref.set(d); },
            async update(d) { return ref.update(d); },
            async delete() { return ref.delete(); },
            onSnapshot(cb, err) { return ref.onSnapshot(cb, err); },
          };
        },
        orderBy() { return chain; },
        limit() { return chain; },
        onSnapshot(cb, err) {
          return root.collection(col).orderBy("ts", "desc").limit(200).onSnapshot(snap => {
            lastDocs = snap.docs;
            lastMsgs = snap.docs.map(d => d.data()).reverse();
            cb(snap);
          }, err);
        },
        async get() { return root.collection(col).get(); },
        async add(d) { return root.collection(col).add(d); },
      };
      return chain;
    },
  };
}

async function enter(n) {
  name = n;
  $("gate").classList.add("hide");
  $("app").classList.remove("hide");
  $("me").textContent = "@" + n;
  $("load-feed").classList.remove("hide");
  joinedAt = Date.now();

  if (mode === "api") {
    if (!$("att").dataset.bound) {
      $("att").dataset.bound = "1";
    }
    await api("/api/presence", { method: "POST", body: { name: n } });
    await refreshMessages();
    $("load-feed").classList.add("hide");
    pollTimer = setInterval(refreshMessages, 1800);
    presenceTimer = setInterval(async () => {
      try {
        await api("/api/presence", { method: "POST", body: { name: n } });
        const p = await api("/api/presence");
        $("online").textContent = "● " + p.online + " online";
      } catch {}
    }, 5000);
    const p = await api("/api/presence");
    $("online").textContent = "● " + p.online + " online";
    setNote("Messages save automatically until you tap Leave.", "ok");
    chatReady = true;
    return;
  }

  $("sv").classList.remove("hide");
  db = claudeDbAdapter();
  if (!assets) $("att").classList.add("hide");
  unsub = db.collection("messages").onSnapshot(() => {
    render(lastMsgs);
    $("load-feed").classList.add("hide");
  }, () => setNote("Couldn't load messages.", "bad"));
  unsubMeta = db.collection("meta").doc("chat").onSnapshot(s => {
    const m = s.exists && s.data();
    if (m?.endedBy && m.endedBy !== uid && m.ts > joinedAt) {
      setNote("Unsaved messages were cleared. Saved messages stay.");
    }
  }, () => {});
  beginSession();
  chatReady = true;
}

async function refreshMessages() {
  try {
    const { messages } = await api("/api/messages");
    lastMsgs = messages;
    render(messages);
  } catch {
    setNote("Reconnecting…", "bad");
  }
}

async function beginSession() {
  try {
    room = await claude.use("room");
    if (!room) return;
    room.presence({ name });
    room.onPeers(c => {
      $("online").textContent = "● " + c.peers.filter(p => p.kind !== "agent").length + " online";
    });
    await new Promise(r => setTimeout(r, 2500));
    const others = room.peers().filter(p => !p.isMe && p.kind !== "agent").length;
    if (others === 0) {
      await wipe(false);
      setNote(lastDocs.some(d => d.data?.().saved) ? "Saved chat loaded." : "New chat started.", "ok");
    }
  } catch {}
}

async function wipe(all) {
  if (mode === "api") {
    await api("/api/messages?all=" + (all ? "true" : "false"), { method: "DELETE" });
    return;
  }
  const s = await db.collection("messages").get();
  await Promise.all(
    s.docs.filter(d => all || d.data().saved !== true).map(d => db.collection("messages").doc(d.id).delete()),
  );
  await db.collection("meta").doc("chat").set({ endedBy: uid, ts: Date.now() });
}

async function saveChat() {
  if (mode === "api") {
    const r = await api("/api/messages/save-all", { method: "PATCH" });
    setNote(r.saved ? "Saved " + r.saved + " messages." : "Already saved.", "ok");
    return true;
  }
  const todo = lastDocs.filter(d => d.data().saved !== true);
  if (!todo.length) {
    setNote(lastDocs.length ? "Already saved." : "Nothing to save yet.");
    return true;
  }
  try {
    await Promise.all(todo.map(d => db.collection("messages").doc(d.id).update({ saved: true })));
    setNote("Saved — it stays in the chat.", "ok");
    return true;
  } catch {
    setNote("Couldn't save.", "bad");
    return false;
  }
}

function ask(title, text, b1, b2) {
  return new Promise(res => {
    $("mt").textContent = title;
    $("mp").textContent = text;
    $("m1").textContent = b1;
    $("m2").textContent = b2 || "";
    $("m2").classList.toggle("hide", !b2);
    $("modal").classList.remove("hide");
    const done = v => { $("modal").classList.add("hide"); res(v); };
    $("m1").onclick = () => done(1);
    $("m2").onclick = () => done(2);
    $("m3").onclick = () => done(0);
  });
}

$("go").onclick = async () => {
  const n = $("u").value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
  $("err").textContent = "";
  if (!mode) return ($("err").textContent = "Backend not ready.");
  if (n.length < 3) return ($("err").textContent = "Username: 3+ letters, numbers or _");
  $("go").disabled = true;
  $("go").textContent = "Signing in…";
  try {
    if (mode === "api") {
      const r = await api("/api/auth/enter", { method: "POST", body: { username: n, password: $("p").value } });
      apiToken = r.token;
      uid = r.userId;
      store.set("vvvaaa-token", apiToken);
      store.set("velvet-name", n);
      await enter(n);
    } else {
      if ($("p").value !== "safelife100") throw { status: 403 };
      const ref = nativeDb.collection("users").doc(n);
      const s = await ref.get();
      if (s.exists && s.data().owner !== uid) throw { status: 409 };
      if (!s.exists) await ref.set({ owner: uid, created: Date.now() });
      store.set("velvet-name", n);
      await enter(n);
    }
  } catch (e) {
    const msg = e.status === 403 ? "Wrong password." : e.status === 409 ? "Username taken." : "Couldn't sign in. Try again.";
    $("err").textContent = msg;
  } finally {
    $("go").disabled = false;
    $("go").textContent = "Sign in";
  }
};
$("p").onkeydown = e => { if (e.key === "Enter") $("go").click(); };

$("sv").onclick = saveChat;
$("del").onclick = async () => {
  if (mode === "api") {
    const c = await ask("Clear chat?", "Deletes every message for everyone. This cannot be undone.", "Clear all", "");
    if (c !== 1) return;
    await api("/api/messages", { method: "DELETE" });
    await refreshMessages();
    setNote("Chat cleared.", "ok");
    return;
  }
  const c = await ask("Delete chat?", "Removes unsaved messages for everyone. Saved messages stay unless you delete everything.", "Delete session", "Delete all");
  if (!c) return;
  await wipe(c === 2);
};
$("out").onclick = async () => {
  if (mode === "api") {
    try { await api("/api/auth/leave", { method: "POST" }); } catch {}
    store.del("velvet-name");
    store.del("vvvaaa-token");
  } else {
    const c = await ask("Leave chat?", "Unsaved messages clear when you leave unless you save first.", "Save, then leave", "Leave without saving");
    if (!c) return;
    if (c === 1 && !(await saveChat())) return;
    await wipe(false);
    store.del("velvet-name");
  }
  if (pollTimer) clearInterval(pollTimer);
  if (presenceTimer) clearInterval(presenceTimer);
  if (unsub) unsub();
  if (unsubMeta) unsubMeta();
  location.reload();
};

function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const IMG = /\.(png|jpe?g|gif|webp|avif)(\?|$)/i, VID = /\.(mp4|webm|mov)(\?|$)/i;

function linkify(parent, text) {
  const re = /https?:\/\/[^\s<]+/g;
  let last = 0, m;
  const frag = document.createDocumentFragment();
  const add = s => { if (s) frag.appendChild(document.createTextNode(s)); };
  while ((m = re.exec(text))) {
    add(text.slice(last, m.index));
    const url = m[0];
    if (IMG.test(url)) {
      const i = document.createElement("img");
      i.src = url; i.loading = "lazy"; i.referrerPolicy = "no-referrer";
      frag.appendChild(i);
    } else if (VID.test(url)) {
      const v = document.createElement("video");
      v.src = url; v.controls = true; v.preload = "metadata";
      frag.appendChild(v);
    } else {
      const a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = url;
      frag.appendChild(a);
    }
    last = m.index + url.length;
  }
  add(text.slice(last));
  parent.appendChild(frag);
}

function render(list) {
  const f = $("feed");
  const stick = f.scrollHeight - f.scrollTop - f.clientHeight < 120;
  f.textContent = "";
  if (!list.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "No messages yet. Say something irresistible. 💋";
    f.appendChild(e);
  }
  let prev = null, lastDay = "";
  for (const m of list) {
    const ts = Number(m.ts);
    const day = new Date(ts).toDateString();
    if (day !== lastDay) {
      const s = document.createElement("div");
      s.className = "day";
      s.textContent = day === new Date().toDateString() ? "Today" : day;
      f.appendChild(s);
      lastDay = day;
      prev = null;
    }
    const first = !prev || prev.user !== m.user || ts - Number(prev.ts) > 300000;
    prev = m;
    const row = document.createElement("div");
    row.className = "row" + (m.user === name ? " me" : "");
    const av = document.createElement("div");
    av.className = "av";
    if (first) {
      av.textContent = m.user[0].toUpperCase();
      av.style.background = "hsl(" + hue(m.user) + " 70% 38%)";
    }
    const d = document.createElement("div");
    d.className = "msg" + (m.user === name ? " me" : "");
    if (first) {
      const w = document.createElement("div");
      w.className = "who";
      w.textContent = "@" + m.user;
      d.appendChild(w);
    }
    if (m.text) {
      const p = document.createElement("div");
      linkify(p, String(m.text));
      d.appendChild(p);
    }
  const media = m.media && String(m.media);
  if (media) {
    const url = media.startsWith("/") ? media : media;
    const k = m.kind || "";
    if (k.startsWith("image/") || IMG.test(url)) {
      const i = document.createElement("img");
      i.src = url; i.loading = "lazy";
      d.appendChild(i);
    } else if (k.startsWith("video/") || VID.test(url)) {
      const v = document.createElement("video");
      v.src = url; v.controls = true; v.preload = "metadata";
      d.appendChild(v);
    } else {
      const a = document.createElement("a");
      a.className = "file";
      a.href = url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "📄 " + (m.fname || "file");
      d.appendChild(a);
    }
  }
    const t = document.createElement("div");
    t.className = "t";
    t.textContent = new Date(ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    d.appendChild(t);
    if (m.user === name) row.append(d);
    else row.append(av, d);
    f.appendChild(row);
  }
  if (stick || !f.dataset.init) {
    f.scrollTop = f.scrollHeight;
    f.dataset.init = 1;
  }
}

async function post(data) {
  if (!chatReady) return;
  try {
    if (mode === "api") {
      await api("/api/messages", { method: "POST", body: data });
      await refreshMessages();
    } else {
      await db.collection("messages").add({ user: name, uid, ts: Date.now(), ...data });
    }
    setNote("", "");
  } catch {
    setNote("Message didn't send.", "bad");
  }
}

function sendText() {
  const t = $("txt").value.trim();
  if (!t || !chatReady) return;
  $("txt").value = "";
  post({ text: t.slice(0, 2000) });
}
$("send").onclick = sendText;
$("txt").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); } };

EMOJI.forEach(e => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = e;
  b.onclick = () => { $("txt").value += e; $("txt").focus(); };
  $("emo").appendChild(b);
});
$("emob").onclick = () => $("emo").classList.toggle("hide");
$("sp").onchange = () => { $("p").type = $("sp").checked ? "text" : "password"; };
document.addEventListener("click", e => { if (!e.target.closest("#emo,#emob")) $("emo").classList.add("hide"); });
$("feed").addEventListener("click", e => { if (e.target.tagName === "IMG") { $("lbi").src = e.target.src; $("lb").classList.remove("hide"); } });
$("lb").onclick = () => $("lb").classList.add("hide");

const dn = document.createElement("button");
dn.id = "down";
dn.type = "button";
dn.textContent = "↓";
dn.className = "hide";
dn.onclick = () => { $("feed").scrollTop = $("feed").scrollHeight; };
$("app").appendChild(dn);
$("feed").onscroll = () => {
  const f = $("feed");
  dn.classList.toggle("hide", f.scrollHeight - f.scrollTop - f.clientHeight < 200);
};

$("att").onclick = () => $("file").click();
$("file").onchange = () => { const f = $("file").files[0]; $("file").value = ""; upload(f); };
document.addEventListener("paste", e => { const f = [...(e.clipboardData?.files || [])][0]; if (f) upload(f); });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); upload(e.dataTransfer.files[0]); });

async function upload(f) {
  if (!f || !name || !chatReady) return;
  setNote("Uploading…");
  try {
    if (mode === "api") {
      const fd = new FormData();
      fd.append("file", f);
      const r = await api("/api/upload", { method: "POST", body: fd });
      await post({ media: r.url, kind: f.type, fname: f.name.slice(0, 80) });
    } else if (assets) {
      const r = await assets.upload(f);
      const url = r.url.includes("/_blob/") ? "/_blob/" + r.id : r.url;
      await post({ media: url, kind: f.type, fname: f.name.slice(0, 80) });
    }
    setNote("", "");
  } catch {
    setNote("Upload failed (max 20 MB).", "bad");
  }
}

(async () => {
  await detectBackend();
  if (mode === "api" && apiToken && store.get("velvet-name")) {
    try {
      await api("/api/messages");
      await enter(store.get("velvet-name"));
    } catch {
      store.del("vvvaaa-token");
    }
  } else if (mode === "claude" && store.get("velvet-name")) {
    await enter(store.get("velvet-name"));
  }
})();
</script>
