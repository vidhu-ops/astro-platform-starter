<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#9b6b7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="shhh">
<meta name="application-name" content="shhh">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/maskable.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<title>shhh — private whispers</title>
<style>
:root{
  --bg:#0b0a0e;--panel:#14131a;--panel2:#1c1b24;--ink:#1a1822;
  --rose:#9b6b7a;--heat:#c4758a;--wine:#5c3d4a;--gold:#c9a88e;--champagne:#e8dcc8;
  --text:#f4f0eb;--mute:#9a919e;--line:#2a2833;--glow:#c9a88e18;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(900px 520px at 78% -8%,#c4758a18,transparent),
    radial-gradient(700px 480px at -8% 102%,#5c3d4a28,transparent),
    radial-gradient(420px 280px at 50% 100%,#9b6b7a12,transparent),
    linear-gradient(180deg,#0e0d12 0%,var(--bg) 40%);
  color:var(--text);
  font-family:"Outfit",system-ui,sans-serif;
  font-size:15px;letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
.hide{display:none!important}
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.card{
  width:100%;max-width:420px;
  background:linear-gradient(168deg,rgba(28,27,36,.96),rgba(20,19,26,.98));
  border:1px solid var(--line);border-radius:32px;padding:40px 32px 36px;
  box-shadow:0 24px 80px #00000066,0 0 0 1px #ffffff08 inset;
}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:4px}
.brand-mark{font-family:"Cormorant Garamond",Georgia,serif;font-size:52px;font-weight:600;font-style:italic;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(105deg,var(--champagne),var(--gold) 45%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-tag{font-size:11px;text-transform:uppercase;letter-spacing:.22em;color:var(--mute);font-weight:500;margin-bottom:6px}
h1{margin:0}
.sub{color:var(--mute);margin:0 0 26px;font-size:14px;line-height:1.55;max-width:34ch}
input[type=text],input[type=password],input[type=search]{
  width:100%;background:var(--ink);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:12px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{border-color:#9b6b7a88;box-shadow:0 0 0 3px #9b6b7a22}
input::placeholder{color:#6f6a78}
.btn{
  width:100%;border:0;border-radius:16px;padding:15px;cursor:pointer;font-weight:600;letter-spacing:.04em;
  background:linear-gradient(100deg,var(--wine),var(--rose));box-shadow:0 12px 32px #00000055;color:var(--champagne);
  transition:transform .15s,box-shadow .15s;
}
.btn:active{transform:scale(.99)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--text)}
.err{color:#d4a5b0;font-size:13px;min-height:18px;margin-top:12px}
#app{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto}
header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:14px 16px;border-bottom:1px solid var(--line);
  background:rgba(11,10,14,.82);backdrop-filter:blur(16px);
}
.hdr-brand{display:flex;align-items:baseline;gap:8px;min-width:0}
header h2{
  margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600;font-style:italic;letter-spacing:-.03em;
  background:linear-gradient(100deg,var(--champagne),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.hdr-tag{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500}
.hdr-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hdr-actions span{color:var(--mute);font-size:12px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{
  border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;
  background:var(--panel);color:var(--mute);font-size:11px;font-weight:500;white-space:nowrap;
  transition:border-color .2s,color .2s,background .2s;
}
.pill:hover{border-color:#9b6b7a55;color:var(--text);background:var(--panel2)}
.pill.heart{background:linear-gradient(100deg,#4a3140,var(--heat));border-color:transparent;color:var(--champagne);animation:softPulse 3s ease-in-out infinite}
@keyframes softPulse{0%,100%{box-shadow:0 0 0 0 #c4758a00}50%{box-shadow:0 0 20px 2px #c4758a33}}
.pill.install{border-color:var(--gold);color:var(--gold)}
#feed{flex:1;overflow-y:auto;padding:18px 16px 12px;display:flex;flex-direction:column;gap:14px}
.msg{
  max-width:84%;padding:12px 16px;border-radius:22px 22px 22px 8px;
  background:var(--panel2);border:1px solid var(--line);word-wrap:break-word;overflow-wrap:anywhere;
  position:relative;animation:fadeIn .35s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 4px 20px #00000033;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;border-radius:22px 22px 8px 22px;background:linear-gradient(145deg,#3d2834 0%,#5c3d4a 55%,#6a4455 100%);border-color:#c4758a55;box-shadow:0 6px 28px #c4758a18}
.msg.marked{box-shadow:0 0 0 1px var(--gold),0 0 24px #c9a88e1a}
.reply-quote{
  font-size:12px;color:var(--mute);border-left:2px solid var(--gold);padding:4px 0 8px 12px;margin-bottom:8px;opacity:.92;
}
.who{font-size:11px;color:var(--gold);margin-bottom:5px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;letter-spacing:.02em}
.me .who{color:var(--champagne)}
.msg-tools{display:flex;gap:6px;margin-top:10px;opacity:.88}
.msg-tools button{
  background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:10px;cursor:pointer;color:var(--mute);
  letter-spacing:.03em;text-transform:uppercase;
}
.msg-tools button.on{color:var(--gold);border-color:var(--gold)}
.t{font-size:10px;color:#7a7580;margin-top:8px;text-align:right;letter-spacing:.04em}
.msg img,.msg video{max-width:100%;max-height:360px;border-radius:16px;display:block;margin-top:10px}
.msg a{color:var(--gold);text-underline-offset:3px}
.file{display:inline-block;margin-top:8px;padding:8px 14px;border:1px dashed #9b6b7a66;border-radius:12px;text-decoration:none;color:var(--champagne)}
#replybar{
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);
  background:var(--panel);font-size:13px;color:var(--mute);
}
#replybar strong{color:var(--rose)}
#replybar button{margin-left:auto;background:none;border:0;color:var(--mute);cursor:pointer;font-size:20px;line-height:1}
#bar{display:flex;gap:8px;align-items:center;padding:12px 14px 16px;border-top:1px solid var(--line);background:rgba(11,10,14,.94);position:relative}
#bar input[type=text]{margin:0;flex:1;border-radius:999px;background:var(--ink)}
.ic{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:17px}
.send{width:48px;height:44px;flex:none;border:0;border-radius:50%;background:linear-gradient(135deg,var(--wine),var(--heat));cursor:pointer;font-size:17px;color:var(--champagne);box-shadow:0 4px 18px #c4758a40}
#emo{position:absolute;bottom:68px;left:12px;right:12px;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:200px;overflow:auto;z-index:5;box-shadow:0 16px 48px #0009}
#emo button{background:none;border:0;font-size:22px;cursor:pointer;padding:4px;border-radius:8px}
#emo button:hover{background:#ffffff08}
#gifpanel{position:fixed;inset:0;background:#000000bb;backdrop-filter:blur(6px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#gifpanel .sheet{
  width:100%;max-width:820px;max-height:78vh;background:linear-gradient(180deg,#1c1b24,#0b0a0e);
  border:1px solid var(--line);border-radius:28px 28px 0 0;padding:18px 16px 28px;
  display:flex;flex-direction:column;gap:12px;
}
#gifpanel .tabs{display:flex;gap:8px;flex-wrap:wrap}
#gifpanel .tabs button{border-radius:999px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;cursor:pointer;font-size:11px;color:var(--mute);letter-spacing:.03em}
#gifpanel .tabs button.on{border-color:var(--rose);color:var(--champagne);background:#9b6b7a22}
#gifsearch{display:flex;gap:8px}
#gifsearch input{flex:1;margin:0}
#gifsearch button{width:auto;padding:0 18px;border-radius:16px;border:0;background:var(--rose);color:var(--champagne);cursor:pointer;font-weight:600}
#gifgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;overflow-y:auto;flex:1}
#gifgrid button{border:0;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:var(--ink)}
#gifgrid img{width:100%;height:100%;object-fit:cover;display:block}
#modal{position:fixed;inset:0;background:#000000aa;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
#modal .card{max-width:360px}#modal p{margin:0 0 16px}#modal .btn{margin-bottom:8px}#modal .btn.alt{background:var(--panel2);border:1px solid var(--line);box-shadow:none}
.note{color:var(--mute);font-size:12px;text-align:center;padding:4px 0 10px;letter-spacing:.02em}
.ic.on{border-color:var(--rose);background:#9b6b7a28;box-shadow:0 0 0 1px #9b6b7a44}
.view-once{padding:11px 15px;margin-top:10px;border-radius:14px;border:1px dashed #9b6b7a88;background:var(--panel);color:var(--gold);cursor:pointer;font-size:12px;text-align:center;width:100%;letter-spacing:.02em}
.view-once.opened{color:var(--mute);border-style:solid;cursor:default}
.view-once.sent{color:var(--mute);font-style:italic;cursor:default;border-color:var(--line)}
#viewer{position:fixed;inset:0;background:#000000f2;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;-webkit-user-select:none;user-select:none}
#viewer .shield{position:absolute;inset:0;z-index:2}
#viewer img,#viewer video{max-width:100%;max-height:78vh;border-radius:16px;pointer-events:none;-webkit-user-drag:none}
#viewer p{color:var(--mute);font-size:12px;margin:14px 0 0;text-align:center;max-width:320px;line-height:1.5}
#viewer .close{margin-top:16px;border:1px solid var(--line);background:var(--panel);padding:10px 22px;border-radius:999px;cursor:pointer;color:var(--text)}
#app.noblur{filter:none}
@media (max-width:520px){
  #gate{padding:20px 16px}
  .brand-mark{font-size:3.25rem}
  header{padding:12px 12px 10px}
  header h2{font-size:1.75rem}
  .hdr-brand{flex:1;min-width:0}
  .hdr-tag{font-size:9px;letter-spacing:.2em}
  .hdr-actions{width:100%;justify-content:flex-start;gap:5px}
  .hdr-actions span{order:-1;width:100%;max-width:none;margin-bottom:2px;font-size:11px}
  #think .lbl{display:none}
  #think::after{content:" thinking"}
  .pill{padding:7px 10px;font-size:10px}
  #bar{padding:10px 10px 14px;gap:6px}
  .ic{width:40px;height:40px;font-size:16px}
}
</style>
</head>
<body>
<div id="gate"><div class="card">
  <div class="brand">
    <span class="brand-tag">private whispers</span>
    <h1 class="brand-mark">shhh</h1>
  </div>
  <p class="sub">Quiet luxury for the messages you’d never say out loud. Install for discreet, heated notifications.</p>
  <input id="u" type="text" placeholder="Username" autocomplete="off" maxlength="20">
  <input id="p" type="password" placeholder="Password">
  <button class="btn" id="go">Sign up / Enter</button>
  <div class="err" id="err"></div>
</div></div>

<div id="app" class="hide">
<header>
  <div class="hdr-brand">
    <h2>shhh</h2><span class="hdr-tag">private</span>
  </div>
  <div class="hdr-actions">
    <span id="me"></span>
    <button type="button" class="pill install hide" id="install">Install</button>
    <button type="button" class="pill heart" id="think" title="Ping everyone with a heart notification">💗<span class="lbl"> Thinking of you</span></button>
    <button type="button" class="pill" id="sv">Save</button>
    <button type="button" class="pill" id="del">Delete</button>
    <button type="button" class="pill" id="out">Leave</button>
  </div>
</header>
<div id="feed"></div>
<div class="note" id="note"></div>
<div id="replybar" class="hide">↩ Replying to <strong id="replywho"></strong> <button type="button" id="replyx" aria-label="Cancel reply">×</button></div>
<div id="bar">
  <div id="emo" class="hide"></div>
  <button type="button" class="ic" id="emob" title="Emoji">😘</button>
  <button type="button" class="ic" id="gifb" title="Browse spicy & cute GIFs">GIF</button>
  <button type="button" class="ic" id="once" title="View once">👁</button>
  <button type="button" class="ic" id="att" title="Attach">📎</button>
  <input type="file" id="file" class="hide" accept="image/*,video/*,.pdf,.txt,.csv,.md,.json">
  <input type="text" id="txt" placeholder="Melt into the message…" autocomplete="off">
  <button type="button" class="send" id="send" title="Send">➤</button>
</div>
</div>

<div id="gifpanel" class="hide">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong style="font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:20px">Mood board</strong>
      <button type="button" class="pill" id="gifclose">Close</button>
    </div>
    <div class="tabs" id="giftabs">
      <button type="button" data-tier="spicy" class="on">🔥 Spicy</button>
      <button type="button" data-tier="flirty">😏 Flirty</button>
      <button type="button" data-tier="cute">💕 Cute</button>
      <button type="button" data-tier="mood">✨ Mood</button>
    </div>
    <div id="gifsearch"><input type="search" id="gifq" placeholder="Search GIFs…"><button type="button" id="gifgo">Search</button></div>
    <div id="gifgrid"></div>
    <p class="sub" style="margin:0;font-size:11px" id="gifhint">Powered by Klipy when KLIPY_API_KEY is set on Render.</p>
  </div>
</div>

<div id="modal" class="hide"><div class="card"><h1 id="mt" style="font-size:28px"></h1><p class="sub" id="mp"></p>
<button class="btn" id="m1"></button><button class="btn alt" id="m2"></button><button class="btn alt" id="m3">Cancel</button></div></div>
<div id="viewer" class="hide"><div class="shield" id="vshield"></div><div id="vslot"></div><p>One-time view. Closing removes it for everyone.</p><button type="button" class="close" id="vclose">Close</button></div>

<script>
const $=id=>document.getElementById(id);
const EMOJI="😘 😍 🥵 😏 😈 🔥 💋 ❤️ 💕 💘 😉 🥰 😜 🍑 🍒 🍷 🌹 ✨ 💃 🕺 😳 🙈 😂 🤤 💦 🖤 👀 🫦 😻 💫 🥂 🎉".split(" ");
let mode=null,uid=null,nativeDb=null,db=null,assets=null,room=null,name=null;
let unsub=null,unsubMeta=null,pollTimer=null,lastMsgs=[],lastDocs=[],joinedAt=0,sendOnce=false,mediaObjectUrls=[];
let replyTo=null,replyLabel="",appConfig=null,deferredInstall=null,gifTier="spicy";
const NAME_KEY="shhh-name";
const store={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
function savedName(){return store.get(NAME_KEY)||store.get("velvet-name");}
function setSavedName(n){store.set(NAME_KEY,n);store.del("velvet-name");}

async function api(path,opts={}){
  const headers={...(opts.headers||{})};
  if(opts.body&&!(opts.body instanceof FormData)){
    headers["Content-Type"]="application/json";
    opts.body=JSON.stringify(opts.body);
  }
  const res=await fetch(path,{...opts,headers,credentials:"same-origin"});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw Object.assign(new Error(data.error||res.statusText),{status:res.status,data});
  return data;
}

window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;$("install").classList.remove("hide");});
$("install").onclick=async()=>{
  if(!deferredInstall)return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall=null;$("install").classList.add("hide");
};

async function loadConfig(){
  try{appConfig=await api("/api/config");}catch(e){appConfig={};}
}

function urlBase64ToUint8Array(base64){
  const pad="=".repeat((4-base64.length%4)%4);
  const raw=atob((base64+pad).replace(/-/g,"+").replace(/_/g,"/"));
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}

async function setupPwa(){
  if(!("serviceWorker"in navigator))return;
  try{
    const reg=await navigator.serviceWorker.register("/sw.js?v=4");
    if(reg.waiting){reg.waiting.postMessage({type:"SKIP_WAITING"});}
    reg.addEventListener("updatefound",()=>{
      const w=reg.installing;
      if(!w)return;
      w.addEventListener("statechange",()=>{
        if(w.state==="installed"&&navigator.serviceWorker.controller)location.reload();
      });
    });
  }catch(e){}
  if(mode!=="api"||!appConfig?.vapidPublicKey)return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      const perm=await Notification.requestPermission();
      if(perm!=="granted")return;
      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(appConfig.vapidPublicKey),
      });
    }
    const json=sub.toJSON();
    await api("/api/push/subscribe",{method:"POST",body:{endpoint:json.endpoint,keys:json.keys}});
  }catch(e){}
}

async function detectBackend(){
  await loadConfig();
  try{
    const res=await fetch("/api/health");
    const raw=await res.text();
    let h;
    try{h=JSON.parse(raw);}catch{
      if(!res.ok||raw.includes("<!DOCTYPE")||raw.includes("Not Found")){
        $("err").textContent="Server is static-only — in Render set Meow? to Web Service, Start: npm start.";
        return;
      }
    }
    if(h&&h.ok&&h.db){mode="api";return;}
    if(h&&h.db===false){
      $("err").textContent="Add DATABASE_URL (Neon) in Render → Meow? → Environment.";
      mode="api";
      return;
    }
  }catch(e){}
  try{
    if(typeof claude!=="undefined"){
      nativeDb=await claude.use("db");
      assets=await claude.use("assets");
      const u=await claude.use("user");
      uid=u?await u.id():null;
      if(nativeDb&&uid){mode="claude";db=nativeDb;return;}
    }
  }catch(e){}
  if(!mode)$("err").textContent=$("err").textContent||"Chat unavailable.";
}

(async()=>{
  await detectBackend();
  if(mode==="api"&&savedName()){
    try{await api("/api/messages");enter(savedName());return;}catch(e){store.del(NAME_KEY);store.del("velvet-name");}
  }
  if(mode==="claude"){
    const saved=savedName();
    if(saved&&db&&uid)enter(saved);
    else if(!db||!uid)$("err").textContent="Sign in to claude.ai to use this chat.";
  }
})();

$("go").onclick=async()=>{
  const n=$("u").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
  $("err").textContent="";
  if(!mode)return $("err").textContent=$("err").textContent||"Chat unavailable.";
  if(n.length<3)return $("err").textContent="Username: 3+ letters, numbers or _";
  try{
    if(mode==="api"){
      await api("/api/auth/enter",{method:"POST",body:{username:n,password:$("p").value}});
      setSavedName(n);
      $("p").value="";
      enter(n);
    }else{
      const ref=db.collection("users").doc(n),s=await ref.get();
      if(s.exists&&s.data().owner!==uid)return $("err").textContent="That username is taken.";
      if(!s.exists)await ref.set({owner:uid,created:Date.now()});
      setSavedName(n);enter(n);
    }
  }catch(e){
    if(mode==="api"&&e.status===403)return $("err").textContent="Wrong password.";
    $("err").textContent=e.status===409?"That username is taken.":"Couldn't sign up. Try again.";
  }
};
$("p").onkeydown=e=>{if(e.key==="Enter")$("go").click()};

function setReply(m){
  replyTo=m.id;
  const snippet=(m.text||"").slice(0,80)||(m.hasMedia?"media":"")||"…";
  replyLabel="@"+m.user+": "+snippet;
  $("replywho").textContent=replyLabel;
  $("replybar").classList.remove("hide");
  $("txt").focus();
}
function clearReply(){replyTo=null;replyLabel="";$("replybar").classList.add("hide");}
$("replyx").onclick=clearReply;

function enter(n){
  name=n;$("gate").classList.add("hide");$("app").classList.remove("hide");$("me").textContent="@"+n;
  joinedAt=Date.now();
  void setupPwa();
  if(mode==="api"){
    if(pollTimer)clearInterval(pollTimer);
    refreshApi();
    pollTimer=setInterval(refreshApi,2000);
    pollMeta();
    return;
  }
  if(!assets)$("att").classList.add("hide");
  $("think").classList.add("hide");
  $("gifb").classList.add("hide");
  unsub=db.collection("messages").orderBy("ts","desc").limit(200).onSnapshot(snap=>{lastDocs=snap.docs;lastMsgs=snap.docs.map(d=>d.data()).reverse();render(lastMsgs)},()=>{$("note").textContent="Couldn't load messages."});
  unsubMeta=db.collection("meta").doc("chat").onSnapshot(s=>{const m=s.exists&&s.data();if(m&&m.endedBy&&m.endedBy!==uid&&m.ts>joinedAt)$("note").textContent="Unsaved messages were cleared. Saved messages stay."},()=>{});
  beginSession();
}

async function refreshApi(){
  try{
    const {messages}=await api("/api/messages");
    lastMsgs=messages;
    lastDocs=messages.map(m=>({data:()=>m,id:m.id}));
    render(messages);
  }catch(e){$("note").textContent="Couldn't load messages.";}
}

async function pollMeta(){
  try{
    const m=await api("/api/meta");
    if(m.endedBy&&m.endedBy!==uid&&m.ts>joinedAt)$("note").textContent="Unsaved messages were cleared. Saved messages stay.";
  }catch(e){}
  setTimeout(pollMeta,3000);
}

async function beginSession(){
  try{
    room=await claude.use("room");if(!room)return;
    room.presence({name});
    await new Promise(r=>setTimeout(r,2500));
    const others=room.peers().filter(p=>!p.isMe&&p.kind!=="agent").length;
    if(others===0){await wipe();$("note").textContent=lastDocs.some(d=>d.data().saved)?"Saved chat loaded — pick up where you left off.":"New chat started.";}
  }catch(e){}
}

async function wipe(all,confirmPassword){
  try{
    if(mode==="api"){
      const body=all&&confirmPassword?{confirmPassword}:undefined;
      await api("/api/messages?all="+(all?"true":"false"),{method:"DELETE",body});
      await refreshApi();
      return;
    }
    const s=await db.collection("messages").get();
    await Promise.all(s.docs.filter(d=>all||d.data().saved!==true).map(d=>db.collection("messages").doc(d.id).delete()));
    await db.collection("meta").doc("chat").set({endedBy:uid,ts:Date.now()});
  }catch(e){$("note").textContent="Couldn't clear the chat.";}
}

async function saveChat(){
  if(mode==="api"){
    const r=await api("/api/messages/save-all",{method:"PATCH"});
    if(!r.saved){$("note").textContent=lastMsgs.length?"Already saved.":"Nothing to save yet.";return true;}
    $("note").textContent="Saved — it stays in the chat.";
    await refreshApi();
    return true;
  }
  const todo=lastDocs.filter(d=>d.data().saved!==true);
  if(!todo.length){$("note").textContent=lastDocs.length?"Already saved.":"Nothing to save yet.";return true;}
  try{await Promise.all(todo.map(d=>db.collection("messages").doc(d.id).update({saved:true})));$("note").textContent="Saved — it stays in the chat.";return true;}
  catch(e){$("note").textContent="Couldn't save.";return false;}
}

function ask(title,text,b1,b2){
  return new Promise(res=>{
    $("mt").textContent=title;$("mp").textContent=text;$("m1").textContent=b1;$("m2").textContent=b2||"";$("m2").classList.toggle("hide",!b2);$("modal").classList.remove("hide");
    const done=v=>{$("modal").classList.add("hide");res(v)};
    $("m1").onclick=()=>done(1);$("m2").onclick=()=>done(2);$("m3").onclick=()=>done(0);
  });
}

$("sv").onclick=saveChat;
$("del").onclick=async()=>{
  const c=await ask("Delete chat?","Removes this session's unsaved messages for everyone. Saved messages stay unless you choose to delete them too.","Delete this session","Delete everything, saved too");
  if(!c)return;
  if(c===2&&mode==="api"){
    const pw=window.prompt("Room password required to delete all saved messages:");
    if(!pw)return;
    try{await wipe(true,pw);}
    catch(e){$("note").textContent=e.status===403?"Wrong room password.":"Couldn't delete everything.";}
    return;
  }
  await wipe(c===2);
};
$("out").onclick=async()=>{
  const c=await ask("Leave chat?","Leaving deletes this session's unsaved messages. Anything you saved stays for next time.","Save, then leave","Leave, clear unsaved");
  if(!c)return;
  if(c===1&&!(await saveChat()))return;
  await wipe(false);
  if(mode==="api"){try{await api("/api/auth/leave",{method:"POST"});}catch(e){}}
  store.del(NAME_KEY);store.del("velvet-name");
  if(pollTimer)clearInterval(pollTimer);
  if(unsub)unsub();
  if(unsubMeta)unsubMeta();
  location.reload();
};

$("think").onclick=async()=>{
  $("note").textContent="Sending love…";
  try{
    const r=await api("/api/thinking-of-you",{method:"POST"});
    if(!r.pushEnabled)$("note").textContent="Add VAPID keys on Render for heart notifications.";
    else if(!r.sent)$("note").textContent="No one else subscribed yet — they need to open shhh and allow alerts.";
    else $("note").textContent="💗 Hearts sent.";
  }catch(e){$("note").textContent="Couldn't send heart ping.";}
};

const IMG=/\.(png|jpe?g|gif|webp|avif)(\?|$)/i,VID=/\.(mp4|webm|mov)(\?|$)/i;
function linkify(parent,text){
  const re=/https:\/\/[^\s<>"']+/gi;let last=0,m;
  const frag=document.createDocumentFragment();
  const add=s=>{if(s)frag.appendChild(document.createTextNode(s))};
  while((m=re.exec(text))){
    add(text.slice(last,m.index));const url=m[0];
    if(/^javascript:/i.test(url)||/^data:/i.test(url))continue;
    if(IMG.test(url)||/tenor\.com|giphy\.com/i.test(url)){
      const i=document.createElement("img");i.src=url;i.loading="lazy";i.referrerPolicy="no-referrer";frag.appendChild(i);
    }else if(VID.test(url)){
      const v=document.createElement("video");v.src=url;v.controls=true;v.preload="metadata";frag.appendChild(v);
    }else{
      const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=url;frag.appendChild(a);
    }
    last=m.index+url.length;
  }
  add(text.slice(last));parent.appendChild(frag);
}

async function toggleMark(id,btn){
  if(mode!=="api")return;
  try{
    const r=await api("/api/messages/"+id+"/mark",{method:"PATCH"});
    btn.classList.toggle("on",r.marked);
    await refreshApi();
  }catch(e){$("note").textContent="Couldn't mark message.";}
}

function render(list){
  const f=$("feed"),stick=f.scrollHeight-f.scrollTop-f.clientHeight<120;
  f.textContent="";
  for(const m of list){
    const d=document.createElement("div");
    d.className="msg"+(m.user===name?" me":"")+(m.marked?" marked":"");
    const w=document.createElement("div");w.className="who";w.textContent="@"+m.user;d.appendChild(w);
    if(m.replyQuote){
      const rq=document.createElement("div");rq.className="reply-quote";
      rq.textContent=(m.replyQuote.user?"@"+m.replyQuote.user+": ":"")+(m.replyQuote.text||"");
      d.appendChild(rq);
    }
    if(m.text){const p=document.createElement("div");linkify(p,String(m.text));d.appendChild(p);}
    if(m.viewOnce&&(m.hasMedia||m.viewOnceState)){
      const b=document.createElement("button");b.type="button";
      b.className="view-once"+(m.viewOnceState==="opened"?" opened":m.viewOnceState==="sent"?" sent":"");
      if(m.viewOnceState==="opened")b.textContent="👁 Opened — media removed";
      else if(m.viewOnceState==="sent")b.textContent="👁 View once · waiting";
      else{b.textContent="👁 Tap to view once";b.onclick=()=>openViewOnce(m.id,m.kind);}
      d.appendChild(b);
    }else if(m.media&&String(m.media)){
      const url=String(m.media);
      const k=m.kind||"";
      if(mode==="api"&&url.startsWith("/api/media/")){loadAuthMedia(d,url,k,m.fname);}
      else if(k.startsWith("image/")||k.startsWith("image")||IMG.test(url)||/gif/i.test(k)){const i=document.createElement("img");i.src=url;i.loading="lazy";d.appendChild(i);}
      else if(k.startsWith("video/")||VID.test(url)){const v=document.createElement("video");v.src=url;v.controls=true;v.preload="metadata";d.appendChild(v);}
      else{const a=document.createElement("a");a.className="file";a.href=url;a.target="_blank";a.rel="noopener";a.textContent="📄 "+(m.fname||"file");d.appendChild(a);}
    }
    const tools=document.createElement("div");tools.className="msg-tools";
    const br=document.createElement("button");br.type="button";br.textContent="Reply";br.onclick=()=>setReply(m);tools.appendChild(br);
    if(mode==="api"){
      const mk=document.createElement("button");mk.type="button";mk.textContent=m.marked?"★ Marked":"☆ Mark";mk.className=m.marked?"on":"";
      mk.onclick=()=>toggleMark(m.id,mk);tools.appendChild(mk);
    }
    d.appendChild(tools);
    const t=document.createElement("div");t.className="t";
    t.textContent=new Date(Number(m.ts)).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+(m.saved?" · 💾 saved":"")+(m.marked?" · ★":"");
    d.appendChild(t);f.appendChild(d);
  }
  if(stick||!f.dataset.init){f.scrollTop=f.scrollHeight;f.dataset.init=1;}
}

async function post(data){
  try{
  if(mode==="api"){
    const body={...data};if(replyTo)body.replyTo=replyTo;
    await api("/api/messages",{method:"POST",body});
    clearReply();
    await refreshApi();
  }else await db.collection("messages").add({user:name,uid,ts:Date.now(),...data});
  $("note").textContent="";
  }catch(e){$("note").textContent="Message didn't send.";}
}

function sendText(){const t=$("txt").value.trim();if(!t)return;$("txt").value="";post({text:t.slice(0,2000)});}
$("send").onclick=sendText;$("txt").onkeydown=e=>{if(e.key==="Enter")sendText();};

EMOJI.forEach(e=>{const b=document.createElement("button");b.textContent=e;b.onclick=()=>{$("txt").value+=e;$("txt").focus();};$("emo").appendChild(b);});
$("emob").onclick=()=>$("emo").classList.toggle("hide");
$("once").onclick=()=>{sendOnce=!sendOnce;$("once").classList.toggle("on",sendOnce);$("note").textContent=sendOnce?"View once on for next photo/video.":"";};
$("att").onclick=()=>$("file").click();
$("file").onchange=async()=>{
  const f=$("file").files[0];$("file").value="";
  if(!f)return;
  const once=sendOnce&&/^(image|video)\//.test(f.type);
  if(mode==="api"){
    $("note").textContent="Uploading…";
    try{
      const fd=new FormData();fd.append("file",f);fd.append("viewOnce",once?"true":"false");
      const r=await api("/api/upload",{method:"POST",body:fd});
      await post({media:r.url,mediaKey:r.mediaKey,viewOnce:once,kind:f.type,fname:f.name.slice(0,80)});
      $("note").textContent=once?"Sent as view once.":"";sendOnce=false;$("once").classList.remove("on");
    }catch(e){$("note").textContent="Upload failed (max 20 MB; images, video, PDF, text).";}
    return;
  }
  if(!assets)return;
  $("note").textContent="Uploading…";
  try{
    const r=await assets.upload(f);
    await post({media:r.url.includes("/_blob/")?"/_blob/"+r.id:r.url,kind:f.type,fname:f.name.slice(0,80),viewOnce:once});
    $("note").textContent=once?"View once (Claude): disappears for others on leave.":"";
    sendOnce=false;$("once").classList.remove("on");
  }catch(e){$("note").textContent="Upload failed (max 20 MB; images, video, PDF, text).";}
};

$("gifb").onclick=()=>{
  if(mode!=="api")return;
  if(!appConfig?.gifEnabled)$("gifhint").textContent="Add KLIPY_API_KEY on Render (partner.klipy.com) — paste GIF URLs anytime.";
  $("gifpanel").classList.remove("hide");
  searchGifs();
};
$("gifclose").onclick=()=>$("gifpanel").classList.add("hide");
$("giftabs").onclick=e=>{
  const btn=e.target.closest("button[data-tier]");
  if(!btn)return;
  gifTier=btn.dataset.tier;
  $("giftabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===btn));
  searchGifs();
};
$("gifgo").onclick=searchGifs;
$("gifq").onkeydown=e=>{if(e.key==="Enter")searchGifs();};

async function searchGifs(){
  const grid=$("gifgrid");grid.textContent="";
  if(!appConfig?.gifEnabled){grid.textContent="";const p=document.createElement("p");p.className="sub";p.textContent="GIF search needs KLIPY_API_KEY on Render (see RENDER-FIX.md).";grid.appendChild(p);return;}
  try{
    const q=$("gifq").value.trim();
    const url="/api/gifs/search?tier="+encodeURIComponent(gifTier)+(q?"&q="+encodeURIComponent(q):"");
    const {results}=await api(url);
    for(const g of results){
      if(!g.url)continue;
      const b=document.createElement("button");b.type="button";
      const im=document.createElement("img");im.src=g.preview||g.url;im.alt=g.title||"gif";im.loading="lazy";
      b.appendChild(im);
      b.onclick=()=>{post({text:g.url,kind:"image/gif"});$("gifpanel").classList.add("hide");$("note").textContent="GIF sent 🔥";};
      grid.appendChild(b);
    }
    if(!results.length){grid.textContent="No results — try another search.";}
  }catch(e){grid.textContent="Couldn't load GIFs.";}
}

async function loadAuthMedia(parent,url,kind,fname){
  const ph=document.createElement("div");ph.textContent="Loading…";ph.style.color="var(--mute)";parent.appendChild(ph);
  try{
    const res=await fetch(url,{credentials:"same-origin"});
    if(!res.ok)throw 0;
    const blob=await res.blob();const u=URL.createObjectURL(blob);mediaObjectUrls.push(u);
    parent.removeChild(ph);
    if(kind.startsWith("image/")){const i=document.createElement("img");i.src=u;i.className="protected";drapeProtect(i);parent.appendChild(i);}
    else if(kind.startsWith("video/")){const v=document.createElement("video");v.src=u;v.controls=true;v.controlsList="nodownload noremoteplayback";v.disablePictureInPicture=true;drapeProtect(v);parent.appendChild(v);}
    else{const a=document.createElement("span");a.className="file";a.textContent="📄 "+(fname||"file");parent.appendChild(a);}
  }catch(e){ph.textContent="Media unavailable";}
}

function drapeProtect(el){el.draggable=false;el.oncontextmenu=e=>e.preventDefault();el.style.webkitUserSelect="none";el.style.userSelect="none";}

let viewerUrl=null;
async function openViewOnce(id,kind){
  if(mode!=="api")return;
  try{
    const res=await fetch("/api/messages/"+id+"/view-once",{method:"POST",credentials:"same-origin"});
    if(!res.ok)throw 0;
    const blob=await res.blob();closeViewer();
    viewerUrl=URL.createObjectURL(blob);
    const slot=$("vslot");slot.textContent="";
    if(kind&&kind.startsWith("video/")){
      const v=document.createElement("video");v.src=viewerUrl;v.autoplay=true;v.controls=true;v.controlsList="nodownload noremoteplayback";v.disablePictureInPicture=true;drapeProtect(v);slot.appendChild(v);
    }else{const i=document.createElement("img");i.src=viewerUrl;drapeProtect(i);slot.appendChild(i);}
    $("viewer").classList.remove("hide");$("app").classList.add("noblur");
    document.addEventListener("contextmenu",blockCtx,true);
    await refreshApi();
  }catch(e){$("note").textContent="Could not open — already viewed or gone.";await refreshApi();}
}
function blockCtx(e){if(!$("viewer").classList.contains("hide"))e.preventDefault();}
function closeViewer(){
  $("viewer").classList.add("hide");$("vslot").textContent="";
  document.removeEventListener("contextmenu",blockCtx,true);
  if(viewerUrl){URL.revokeObjectURL(viewerUrl);viewerUrl=null;}
}
$("vclose").onclick=closeViewer;
$("vshield").onclick=closeViewer;
document.addEventListener("visibilitychange",()=>{if(document.hidden&&viewerUrl)closeViewer();});
</script>
